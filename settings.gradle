pluginManagement {
    repositories {
        gradlePluginPortal()
    }

    // Workaround for https://github.com/FabricMC/fabric-loom/issues/1020
    buildscript {
        configurations.configureEach {
            resolutionStrategy {
                eachDependency {
                    if (requested.group == "com.google.code.gson" && requested.name == "gson") {
                        useVersion("2.10.1")
                        because("Fabric Loom needs a newer version than foojay toolchains")
                    }
                }
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs
    }
}

rootProject.name = "bingo"
include 'api'
include 'common'
include 'integration-chunky'
include 'integration-jei'
include 'integration-permissions'
include 'integration-placeholders'
include 'integration-vanish'
include 'integration-voicechat'
include 'mc1.20.1'
include 'mc1.20.2'
include 'mc1.20.4'
include 'mc1.20.6'
include 'mc1.21.1'
include 'mc1.21.3'
include 'mc1.21.4'
include 'mc1.21.5'
include 'platform'

