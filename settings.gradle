pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs
    }
}

rootProject.name = "bingo"
include 'api'
include 'common'
include 'integration-chunky'
include 'integration-jei'
include 'integration-permissions'
include 'integration-placeholders'
include 'integration-vanish'
include 'integration-voicechat'
include 'integration-waystones'
include 'integration-journeymap'
include 'integration-xaeros'
include 'mc26.1'
include 'mc26.2'
include 'mc26.3'
include 'platform'

