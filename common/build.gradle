plugins {
    alias(libs.plugins.kotlin.plugin.serialization)
    id 'bingo.mod'
}

loom.accessWidenerPath = file("src/main/resources/bingo.accesswidener")

base.archivesName.set("${project.archives_base_name}-common")

dependencies {
    implementation libs.insert.koin.core

    implementation libs.kotlinx.serialization.json

    modCompileOnly libs.vanish
    modCompileOnly(libs.modmenu) {
        exclude(group: "net.fabricmc")
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly(libs.yacl) {
        exclude(group: "net.fabricmc")
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "com.twelvemonkeys.common")
        exclude(group: "com.twelvemonkeys.imageio")
    }
}

tasks.register('bingoDatapack', Zip) {
    from 'datapack'
    include '**/*'
    archiveFileName.set('datapack.zip')
    destinationDirectory.set(file('src/main/resources/bingo'))
}

tasks.processResources.dependsOn(tasks.bingoDatapack)
tasks.sourcesJar.dependsOn(tasks.bingoDatapack)

tasks.register('bingoImages', Copy) {
    from zipTree(file("images.zip"))
    into file("src/main/resources/bingo/images")
}

tasks.processResources.dependsOn(tasks.bingoImages)
tasks.sourcesJar.dependsOn(tasks.bingoImages)
