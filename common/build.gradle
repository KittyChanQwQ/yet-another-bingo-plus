interface CrowdinWorkParams extends WorkParameters {
    Property<String> getUrl();
    RegularFileProperty getTempFile();
    RegularFileProperty getDestFile();
}

abstract class CrowdinAction implements WorkAction<CrowdinWorkParams> {
    @Inject
    abstract ArchiveOperations getArchiveOperations()

    @Override
    void execute() {
        def params = getParameters()
        def tempFile = params.tempFile.get().asFile
        if (!tempFile.exists()) {
            tempFile.parentFile.mkdirs()
            tempFile.createNewFile()
        }

        new URI(params.url.get()).toURL().withInputStream { i ->
            tempFile.withOutputStream { out -> out << i }
        }

        def outFile = params.destFile.get().asFile
        if (!outFile.exists()) {
            outFile.createNewFile()
        }

        outFile.withOutputStream { out ->
            out << archiveOperations.gzip(tempFile).read()
        }

        tempFile.delete()

        // If the locale doesn't have any strings, remove the file
        if (outFile.size() < 4L) {
            outFile.delete()
        }
    }
}

@DisableCachingByDefault
abstract class CrowdinTask extends DefaultTask {
    @OutputDirectory
    abstract RegularFileProperty getDestFile();

    @OutputDirectory
    abstract RegularFileProperty getTmpFile();

    @Inject
    abstract WorkerExecutor getWorkerExecutor()

    @TaskAction
    void run() {
        WorkQueue workQueue = getWorkerExecutor().noIsolation()

        // downloads translation files from https://crowdin.com/project/yet-another-bingo
        def langDir = destFile.get()
        def crowdinDistributionHash = "471cb8056b1a73b605b6a283g7g"

        def manifestJson = new URI("https://distributions.crowdin.net/$crowdinDistributionHash/manifest.json").toURL().text
        def manifest = new JsonSlurper().parseText(manifestJson)

        for (lang in manifest.languages) {
            def file = manifest.content[lang][0]
            def fileName = new File(file).name.toLowerCase()
            def tempFile = new File("${tmpFile.get()}/${fileName}.gz")
            def outFile = new File("$langDir/$fileName")

            workQueue.submit(CrowdinAction.class, parameters -> {
                parameters.url.set("https://distributions.crowdin.net/$crowdinDistributionHash$file?timestamp=$manifest.timestamp")
                parameters.tempFile.set(tempFile)
                parameters.destFile.set(outFile)
            })
        }
    }
}

