plugins {
    id "org.jetbrains.kotlin.jvm"
    id "fabric-loom"
}

version = project.mod_version + "+" + project.name
group = project.maven_group + "-" + project.name

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${group}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    log4jConfigs.from file("../buildSrc/src/main/resources/log4j-debug.xml")
}

dependencies {
    // testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    // testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    // testImplementation "org.jetbrains.kotlin:kotlin-test"

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    Set<String> fabricModules = [
            "fabric-api-base",
            "fabric-command-api-v1",
            "fabric-entity-events-v1",
            "fabric-events-interaction-v0",
            "fabric-key-binding-api-v1",
            "fabric-lifecycle-events-v1",
            "fabric-rendering-v1",
            "fabric-resource-loader-v0",
            "fabric-message-api-v1",
            "fabric-networking-api-v1",
            "fabric-screen-api-v1"
    ]
    fabricModules.forEach {
        modImplementation(fabricApi.module(it, project.fabric_version))
    }

    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin}"
    if (!project.name.equals("common")) {
        include "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin}"

        modImplementation "${libs.fabric.permissions.api.get()}"
        include "${libs.fabric.permissions.api.get()}"
    } else {
        modCompileOnly "${libs.fabric.permissions.api.get()}"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def javaVersion = 17
if (project.name.toString() == "common" || project.name.toString() == "mc1.20.1" || project.name.toString() == "mc1.20.2" || project.name.toString() == "mc1.20.4") {
    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    javaVersion = 17
} else {
    // Minecraft 1.20.5 upwards uses Java 21
    javaVersion = 21
}
println("Using Java version $javaVersion")

tasks.withType(JavaCompile).configureEach {
    it.options.release.set(javaVersion)
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    if (javaVersion == 17) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    } else {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    toolchain {
        languageVersion.set(JavaLanguageVersion.of(javaVersion))
    }
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

kotlin {
    jvmToolchain(javaVersion)
}
