plugins {
    id "bingo.common"
}

sourceSets {
    testmod {
        java.srcDirs += [project(":common").sourceSets.testmod.java]
        resources.srcDirs += [project(":common").sourceSets.testmod.resources]
    }
}

loom {
    runs {
        gametestServer {
            server()
            source sourceSets.testmod

            name "Game Test"

            // Enable the gametest runner
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/junit.xml"
            runDir "build/gametest"
        }
    }
}

dependencies {
    implementation libs.insert.koin.core
    include libs.insert.koin.core
    implementation libs.insert.koin.logger.slf4j
    include libs.insert.koin.logger.slf4j

    include libs.hikari
    include libs.flyway.core
    // jackson-databind is a runtime dependency for flyway
    include libs.jackson.core
    include libs.jackson.databind
    include libs.jackson.annotations
    include libs.sqldelight.jdbc
    include libs.sqldelight.runtime
    include libs.sqlite

    include "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin}"

    def fabricPermissionsApi
    if (project.name.compareTo("mc1.21.2") < 0) {
        fabricPermissionsApi = libs.fabric.permissions.api.v2.get()
    } else {
        fabricPermissionsApi = libs.fabric.permissions.api.v3.get()
    }

    modImplementation fabricPermissionsApi
    include fabricPermissionsApi

    api project(path: ":api", configuration: "namedElements")
    include project(path: ":api")
    api project(path: ":common", configuration: "namedElements")
    include project(path: ":common")
}

processResources {
    from("../common/src/main/resources") {
        include "yet-another-minecraft-bingo/icon.png"
    }
}

tasks.test.dependsOn tasks.runGametestServer
