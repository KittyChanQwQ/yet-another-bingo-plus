plugins {
    id "bingo.common"
    id 'com.gradleup.shadow'
}

configurations {
    shade
}

dependencies {
    implementation libs.insert.koin.core
    shade libs.insert.koin.core
    implementation libs.insert.koin.logger.slf4j
    shade libs.insert.koin.logger.slf4j

    include libs.hikari
    shade libs.sqldelight.jdbc
    shade libs.sqldelight.runtime
    include libs.sqlite

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation libs.fabric.language.kotlin
    include libs.fabric.language.kotlin

    api project(path: ":platform")
    clientApi project(path: ":platform", configuration: "archives")
    shade project(path: ":platform")
    api project(path: ":api")
    clientApi project(path: ":api", configuration: "archives")
    include project(path: ":api")
    api project(path: ":common")
    clientApi project(path: ":common", configuration: "archives")
    shade project(path: ":common")
    api project(path: ":integration-chunky")
    shade project(path: ":integration-chunky")
    api project(path: ":integration-jei")
    shade project(path: ":integration-jei")
    api project(path: ":integration-permissions")
    shade project(path: ":integration-permissions")
    api project(path: ":integration-placeholders")
    shade project(path: ":integration-placeholders")
    api project(path: ":integration-vanish")
    shade project(path: ":integration-vanish")
    api project(path: ":integration-voicechat")
    shade project(path: ":integration-voicechat")
    api project(path: ":integration-waystones")
    shade project(path: ":integration-waystones")
    api project(path: ":integration-journeymap")
    shade project(path: ":integration-journeymap")
}

processResources {
    dependsOn(project(":common").tasks.processResources)
    duplicatesStrategy = DuplicatesStrategy.WARN
    from(rootProject.file("common/fabric.mod.json"))
    from(rootProject.file("common/src/main/resources"))
}

shadowJar {
    archiveClassifier.set(null)

    from sourceSets.main.output
    from sourceSets.client.output

    configurations = [project.configurations.shade]

    dependencies {
        include(project(":api"))
        include(project(":common"))
        include(project(":integration-chunky"))
        include(project(":integration-jei"))
        include(project(":integration-permissions"))
        include(project(":integration-placeholders"))
        include(project(":integration-vanish"))
        include(project(":integration-voicechat"))
        include(project(":integration-waystones"))
        include(project(":integration-journeymap"))
        include(project(":platform"))
        include { it.moduleGroup == "io.insert-koin" }
        include { it.moduleGroup == "app.cash.sqldelight" }
    }

    // This should only affect usage of Kotlin features if someone tries to use the entire mod jar as a library
    // ...which you really shouldn't be doing. Don't do that.
    exclude("META-INF/*.kotlin_module")

    relocate "org.koin", "me.jfenn.bingo.koin"
    relocate "app.cash.sqldelight", "me.jfenn.bingo.sqldelight"

    minimize {
        include { it.moduleGroup == "io.insert-koin" }
        include { it.moduleGroup == "app.cash.sqldelight" }
    }
}

loom.nestJars(tasks.named('shadowJar', org.gradle.jvm.tasks.Jar), objects.fileCollection().tap {
    it.setFrom(fileTree(tasks.processIncludeJars.outputDirectory))
    it.builtBy(tasks.processIncludeJars)
})

tasks.assemble.dependsOn(tasks.named('shadowJar'))
