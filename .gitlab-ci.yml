Test:
  stage: test
  image: gradle:alpine
  script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - gradle --build-cache build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  rules:
    - changes:
        - '**/*.kt'
        - '**/*.java'
        - '**/*.gradle'
        - '**/*.json'
        - .gitlab-ci.yml
  artifacts:
    paths:
      - mc*/build/libs/*.jar

GitLab Pages:
  stage: test
  image: node:18.12.1
  cache:
    key: npm
    policy: pull-push
    paths:
      - .npm/
  script:
    - pushd docs
    - npm ci --cache ../.npm --prefer-offline
    - npm run docs:build
    - popd
    - rm -rf public
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab-ci.yml
      allow_failure: true

Sync README:
  stage: deploy
  image: gradle:alpine
  script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - gradle --build-cache modrinthSyncBody
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - README.md

Build and Deploy:
  stage: deploy
  image: gradle:alpine
  script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - gradle --build-cache modrinth
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - mc*/build/libs/*.jar
