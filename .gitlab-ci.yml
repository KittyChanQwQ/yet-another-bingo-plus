stages:
  - test
  - deploy

Test:
  stage: test
  image: gradle:8.8-jdk21
  script:
    - export GRADLE_USER_HOME="$(pwd)/.gradle"
    - gradle --build-cache build
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
      - .gradle/wrapper
      - .gradle/caches
  rules:
    - changes:
        - '**/*.kt'
        - '**/*.java'
        - '**/*.gradle'
        - '**/*.json'
        - .gitlab-ci.yml
  artifacts:
    paths:
      - mc*/build/libs/*.jar

minecraft.horrific.dev:
  stage: test
  trigger: horrific-tweaks/minecraft.horrific.dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
      allow_failure: true

Sync README:
  stage: deploy
  image: gradle:8.8-jdk21
  script:
    - export GRADLE_USER_HOME="$(pwd)/.gradle"
    - gradle --build-cache modrinthSyncBody
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
      - .gradle/wrapper
      - .gradle/caches
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - README.md

Build and Deploy:
  stage: deploy
  image: gradle:8.8-jdk21
  script:
    - export GRADLE_USER_HOME="$(pwd)/.gradle"
    - gradle --build-cache modrinth -x test
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull-push
    paths:
      - .gradle/wrapper
      - .gradle/caches
  rules:
    - if: $CI_COMMIT_TAG =~ /^release\/.*/
  artifacts:
    paths:
      - mc*/build/libs/*.jar
