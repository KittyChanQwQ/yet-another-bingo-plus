plugins {
    alias(libs.plugins.kotlin.plugin.serialization)
    alias(libs.plugins.dokka)
    id 'bingo.common'
    id 'maven-publish'
}

base.archivesName.set("${project.archives_base_name}-api")

// Configure the maven publication
publishing {
    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    publications {
        // Creates a Maven publication called "release".
        create("release", MavenPublication) {
            groupId = "me.jfenn.bingo"
            artifactId = "api"
            version = project.mod_version

            artifact(jar) {
                builtBy jar
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
            }
        }
    }

    repositories {
        maven {
            url = "https://gitlab.com/api/v4/projects/${System.getenv("CI_PROJECT_ID")}/packages/maven"
            name = "GitLab"
            credentials(HttpHeaderCredentials) {
                name = "Job-Token"
                value = System.getenv("CI_JOB_TOKEN")
            }
            authentication {
                create("header", HttpHeaderAuthentication)
            }
        }
    }
}

dokka {
    moduleName.set("api")
    dokkaPublications.html {
        failOnWarning.set(true)
    }
    dokkaSourceSets.main {
        includes.from("README.md")
        sourceLink {
            localDirectory.set(file("src/main/java"))
            remoteUrl("https://gitlab.com/horrificdev/bingo/-/blob/main/api/src/main/java")
            remoteLineSuffix.set("#L")
        }
    }
}
